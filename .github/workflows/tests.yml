# Runs the database-free suite on every push.
#
# WHY ONLY test:unit HERE. `npm test` ends with verify_strategy_book.js, which
# replays two years of real IDX prices out of MySQL to check a golden fixture,
# and `npm run test:integration` needs that same populated database. Neither can
# run against an empty service container — a CI job that stood one up would be
# testing an empty schema and passing. The database-backed suites belong where
# the data is, which is the VPS: see scraper/predeploy_check.sh.
#
# So this is deliberately partial, and named so nobody mistakes a green tick
# here for the whole suite having run.
name: unit tests (no database)

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scraper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci --omit=dev || npm install --omit=dev
      - name: Unit suite
        run: npm run test:unit
      - name: Remind what did NOT run
        if: always()
        run: |
          echo "::notice::This job runs test:unit only. verify_strategy_book.js and"
          echo "::notice::test:integration need the populated database and run on the VPS"
          echo "::notice::via scraper/predeploy_check.sh. A green tick here is not the full suite."
